[project]
name = "cell-explorer-core"
version = "0.1.0"
description = "Shared config and settings for cell-explorer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cell_explorer_core"]
