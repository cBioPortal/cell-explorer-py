[project]
name = "cell-explorer-agent"
version = "0.1.0"
description = "LLM chat agent library for single-cell zarr datasets"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pydantic-settings>=2.8",
    "numpy>=1.26",
    "httpx>=0.28",
    "langfuse>=3.0,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "zarr-access",
]

[tool.uv.sources]
zarr-access = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cell_explorer_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["tests"]
markers = [
    "integration: tests that talk to real external services (HTTP servers, etc.)",
]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "datamodel-code-generator>=0.26",
]
