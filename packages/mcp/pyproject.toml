[project]
name = "cell-explorer-mcp"
version = "0.1.0"
description = "MCP server exposing Cell Explorer single-cell datasets"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12",
    "zarr-access",
    "httpx>=0.28",
    "numpy>=1.26",
]

[tool.uv.sources]
zarr-access = { workspace = true }

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
cell-explorer-mcp = "cell_explorer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cell_explorer_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: tests that talk to the live Cell Explorer deployment",
]
addopts = "-m 'not integration'"
pythonpath = ["tests"]
