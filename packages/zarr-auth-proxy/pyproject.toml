[project]
name = "zarr-auth-proxy"
version = "0.1.0"
description = "JWT-protected file server for zarr datasets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.134.0",
    "uvicorn>=0.41.0",
    "pydantic-settings>=2.8.1",
    "pyjwt[crypto]>=2.9.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_auth_proxy"]
