[project]
name = "cell-explorer-api"
version = "0.1.0"
description = "FastAPI cell-explorer API and static file serving"
requires-python = ">=3.12"
dependencies = [
    "cell-explorer-auth",
    "cell-explorer-core",
    "fastapi>=0.134.0",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cell-explorer-auth = { workspace = true }
cell-explorer-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cell_explorer_api"]
