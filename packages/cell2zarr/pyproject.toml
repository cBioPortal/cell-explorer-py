[project]
name = "cell2zarr"
version = "0.1.0"
description = "h5ad to Zarr conversion pipeline for single-cell RNA-seq data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.12.6",
    "fastapi>=0.134.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "pydantic>=2.12.5",
    "scanpy>=1.11.5",
    "uvicorn>=0.41.0",
    "zarrs>=0.2.2",
]

[project.scripts]
cell2zarr = "cell2zarr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cell2zarr"]
