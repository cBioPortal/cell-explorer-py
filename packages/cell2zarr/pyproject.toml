[project]
name = "cell2zarr"
version = "0.3.0"
description = "h5ad to Zarr conversion pipeline for single-cell RNA-seq data"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.12.6",
    "fastapi>=0.134.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "pydantic>=2.12.5",
    "scanpy>=1.11.5",
    "uvicorn>=0.41.0",
    "zarrs>=0.2.2",
    "click>=8.1",
    "click-default-group>=1.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.scripts]
cell2zarr = "cell2zarr.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cell2zarr"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): cell2zarr@{version}

Automatically generated by python-semantic-release
"""
tag_format = "cell2zarr-v{version}"
version_toml = ["pyproject.toml:project.version"]
# Stay in the 0.x range while we're still pre-stable. See cell-explorer-api
# pyproject.toml for the rationale (python-semantic-release v10 default change).
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "cell2zarr-"
