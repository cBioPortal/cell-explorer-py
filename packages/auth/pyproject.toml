[project]
name = "cell-explorer-auth"
version = "0.1.0"
description = "Keycloak OAuth2 and CloudFront signed cookie minting for cell-explorer"
requires-python = ">=3.12"
dependencies = [
    "cell-explorer-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
cell-explorer-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cell_explorer_auth"]
