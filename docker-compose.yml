services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Bare name = pass-through from host shell env (no value if unset, so
      # any GIT_SHA baked into the image by Dockerfile is preserved). The
      # `make dev-docker` target exports this from `git rev-parse`.
      - GIT_SHA
    volumes:
      # Mount local source for hot-reload
      - ./packages/api/src:/app/packages/api/src
      # Mount local frontend build
      - ../cbioportal-cell-explorer/packages/highperformer/dist:/app/static:ro
      # Persistent app data (logs, database)
      - ./data:/app/data
      # Dev keys for datasource signing
      - ./dev-keys:/keys:ro

  zarr-server:
    build:
      context: .
      dockerfile: packages/zarr-auth-proxy/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - PUBLIC_KEY_FILE=/keys/public.pem
      - DATA_DIR=/data
      - CORS_ORIGINS=http://localhost:8001
    volumes:
      - ./data:/data:ro
      - ./dev-keys:/keys:ro
