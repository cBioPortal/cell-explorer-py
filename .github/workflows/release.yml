name: Release

on:
  workflow_dispatch:
    inputs:
      force_level:
        description: 'Force bump level (leave empty for auto-detect from commits)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Run semantic-release as an ordinary step rather than its Docker action.
      # The action builds its image at run time and resolves dependencies then,
      # and semantic-release declares `gitpython~=3.0` — a range wide enough to
      # admit any 3.x. GitPython 3.1.60 briefly removed `Actor.name_email_regex`,
      # which semantic-release calls when validating the commit author, and every
      # release failed for a month with nothing in this repo having changed (#192).
      # Pinning both here is the only way to close that: the action exposes no
      # input to constrain what it installs, so pinning the action does nothing.
      # Bump these deliberately; do not widen them.
      - name: Install semantic-release
        run: pip install 'python-semantic-release==10.7.0' 'GitPython==3.1.62'

      - name: Configure git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Release cell-explorer-api
        id: release-api
        working-directory: packages/api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_level }}
        run: |
          force=""
          [ -n "$FORCE" ] && force="--$FORCE"
          # --print-tag prints the CURRENT tag when there is nothing to release,
          # so the signal is whether it differs from the last released tag.
          next=$(semantic-release --noop version $force --print-tag 2>/dev/null)
          last=$(semantic-release --noop version --print-last-released-tag 2>/dev/null)
          if [ "$next" = "$last" ]; then
            echo "Nothing to release for cell-explorer-api (at $last)"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          semantic-release -v version $force
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Publish cell-explorer-api GitHub Release
        if: steps.release-api.outputs.released == 'true'
        working-directory: packages/api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v publish --tag '${{ steps.release-api.outputs.tag }}'

      - name: Release cell2zarr
        id: release-cell2zarr
        working-directory: packages/cell2zarr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_level }}
        run: |
          force=""
          [ -n "$FORCE" ] && force="--$FORCE"
          next=$(semantic-release --noop version $force --print-tag 2>/dev/null)
          last=$(semantic-release --noop version --print-last-released-tag 2>/dev/null)
          if [ "$next" = "$last" ]; then
            echo "Nothing to release for cell2zarr (at $last)"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          semantic-release -v version $force
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Publish cell2zarr GitHub Release
        if: steps.release-cell2zarr.outputs.released == 'true'
        working-directory: packages/cell2zarr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v publish --tag '${{ steps.release-cell2zarr.outputs.tag }}'

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Get API version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('packages/api/pyproject.toml','rb'))['project']['version'])")
          echo "api_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cbioportal/cell-explorer-py:${{ steps.version.outputs.api_version }}
            ghcr.io/cbioportal/cell-explorer-py:latest
            ghcr.io/cbioportal/cell-explorer-py:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            FRONTEND_CACHE_BUST=${{ github.run_id }}
