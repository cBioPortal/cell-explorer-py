name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The image bundles the frontend, cloned from cbioportal-cell-explorer at
  # build time. A frontend-only change never touches this repo, so nothing
  # would rebuild it. Dispatching gets a fresh run id, which busts
  # FRONTEND_CACHE_BUST and forces a current clone — re-running an existing run
  # would not, since the run id is unchanged and the clone layer stays cached.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0

      - run: uv python install 3.12

      - run: uv sync

      - name: AppConfig Pydantic codegen drift check
        run: |
          make generate-app-config
          if ! git diff --exit-code packages/cell-explorer-agent/src/cell_explorer_agent/schema/app_config.py; then
            echo "::error::packages/cell-explorer-agent/src/cell_explorer_agent/schema/app_config.py is stale. Run 'make generate-app-config' and commit the result."
            exit 1
          fi

      - run: uv run pytest packages/api/tests/ -v

      - run: uv run pytest packages/cell2zarr/tests/ -v

      - run: uv run pytest packages/zarr-access/tests/ -v

      - run: uv run pytest packages/zarr-auth-proxy/tests/ -v

      - run: uv run pytest packages/cell-explorer-agent/tests/ -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cell_explorer
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cell_explorer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cell_explorer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://cell_explorer:test@localhost:5432/cell_explorer
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0

      - run: uv python install 3.12

      - run: uv sync

      # The models must describe exactly the schema the migrations build: the
      # rest of the suite creates its tables from the models.
      - name: Migrations match models
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: |
          uv run --project packages/api alembic -c packages/api/alembic.ini upgrade head
          uv run --project packages/api alembic -c packages/api/alembic.ini check

      - run: uv run pytest packages/api/tests/test_postgres.py -v

  docker:
    needs: [test, postgres]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cbioportal/cell-explorer-py:latest
            ghcr.io/cbioportal/cell-explorer-py:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            FRONTEND_CACHE_BUST=${{ github.run_id }}
